CONFIG_BT=y
CONFIG_GPIO=y

#GATT
#CONFIG_BT_GATT_DYNAMIC_DB=names
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# STEP 1 - Enable nrfx drivers #
# Right names for low-level peripheral drivers
#CONFIG_ADC=y
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y
# enable spi and other???
#CONFIG_CBPRINTF_FP_SUPPORT=y
#CONFIG_RESET_ON_FATAL_ERROR=n
#CONFIG_HEAP_MEM_POOL_SIZE=8192
#CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
#CONFIG_MAIN_STACK_SIZE=4096
#CONFIG_THREAD_NAME=y
#CONFIG_BT_RX_STACK_SIZE=2048
# STEP 1.1 - Enable Kconfigs for SPI and GPIO
#CONFIG_GPIO=y
#CONFIG_SPI=y
##############################################################################
# BLE ON/OFF — set to n for RTC-only low-power stim (no radio)
##############################################################################

CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Chronos"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y
#help buffers not to be dropped
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
#CONFIG_BT_NUS_SECURITY_ENABLED=n

##############################################################################
# Peripherals: GPIO, SPIM1, TIMER0 (burst), TIMER2 (period)
##############################################################################
#CONFIG_NRFX=y
CONFIG_DEVICE_DT_METADATA=n
CONFIG_DEVICE_DEPS=n
CONFIG_NRFX_SPIM=y
CONFIG_NRFX_TIMER=y
CONFIG_GPIO=y
#CONFIG_SPI=y
#CONFIG_NRFX_SPIM00=y
CONFIG_NRFX_QSPI=n
# TIMER: nRF54L15 uses TIMER20, TIMER22 etc. (enable per-instance in overlay if needed)
#CONFIG_NRFX_TIMER0=y
#CONFIG_NRFX_TIMER1=y

##############################################################################
# DK LEDs (BLE build uses dk_set_led in main)
##############################################################################
CONFIG_DK_LIBRARY=y

##############################################################################
# Heap / stacks (BLE needs more than RTC-only)
##############################################################################
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

##############################################################################
# UART / serial (NUS UART + console)
# NUS sample path expects async UART; enables CONFIG_BT_NUS_UART_* sizes in Kconfig.
##############################################################################
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

##############################################################################
# Console / log / debug
##############################################################################
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_DEBUG_THREAD_INFO=n
CONFIG_ASSERT=n

##############################################################################
# Boot / size
##############################################################################
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_SIZE_OPTIMIZATIONS=y

##############################################################################
# Flash
##############################################################################
CONFIG_FLASH=y
CONFIG_FLASH_MAP=n
CONFIG_FLASH_PAGE_LAYOUT=n
CONFIG_SPI_NOR=n